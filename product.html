    <script>
        const params = new URLSearchParams(window.location.search);
        const productId = params.get('id');
        var productData = null; 

        // --- START OF FIX ---

        /**
         * Takes the raw description text from Firestore and converts it to formatted HTML.
         * @param {string} text The raw text to format.
         * @returns {string} The formatted HTML string.
         */
        function formatDescription(text) {
            if (!text) return "";

            // Standardize different kinds of newlines
            const standardizedText = text.replace(/\s*\/\s*n\s*/g, '\n');
            const lines = standardizedText.split('\n');
            let html = '';
            let inList = false;

            lines.forEach(line => {
                const trimmedLine = line.trim();
                
                if (trimmedLine.startsWith('-')) {
                    // This is a list item
                    if (!inList) {
                        html += '<ul>'; // Start the list
                        inList = true;
                    }
                    html += `<li>${trimmedLine.substring(1).trim()}</li>`;
                } else {
                    // This is not a list item
                    if (inList) {
                        html += '</ul>'; // End the previous list
                        inList = false;
                    }

                    if (trimmedLine.startsWith('#')) {
                        // Treat lines with # as simple paragraphs
                        html += `<p>${trimmedLine.substring(1).trim()}</p>`;
                    } else if (trimmedLine.toUpperCase() === "BELIEVE OR NOT, IT'S THE BEST EVER FORMAL COLLECTION") {
                        // Make this line a heading
                        html += `<h4>${trimmedLine}</h4>`;
                    } else if (trimmedLine) {
                        // Any other non-empty line
                        html += `<p>${trimmedLine}</p>`;
                    }
                }
            });

            // If the text ends with a list, close the <ul> tag
            if (inList) {
                html += '</ul>';
            }

            return html;
        }

        // --- END OF FIX ---

        if (!productId) {
            document.getElementById('product-detail').innerHTML = `
                <div style="text-align: center; padding: 50px; color: white;">
                    <h2>No Product Selected</h2>
                    <p>Please select a product from our creations page to see its details.</p>
                    <a href="products.html" style="display: inline-block; margin-top: 20px; padding: 10px 20px; background: #ff7e5f; color: white; text-decoration: none; border-radius: 5px;">View Products</a>
                </div>
            `;
        } else {
            db.collection("products").doc(productId).get().then(doc => {
                if (!doc.exists) {
                    document.getElementById('product-detail').innerHTML = "<h1>Product not found!</h1>";
                    return;
                }
                const data = doc.data();
                productData = { ...data, id: productId }; 

                // --- USE THE FORMATTING FUNCTION HERE ---
                const formattedDescription = formatDescription(data.description || "");

                let images = [];
                if (Array.isArray(data.image)) images = data.image;
                else if (Array.isArray(data.images)) images = data.images;
                else if (typeof data.image === "string") images = [data.image];

                let thumbnails = images.map((url, i) =>
                    `<img src="${url}" alt="thumbnail ${i+1}" class="${i===0?'active':''}" onclick="setMainImage(this.src)">`
                ).join('');

                document.getElementById('product-detail').innerHTML = `
                    <div class="product-detail-container">
                        <div class="product-images-main">
                            <img id="main-product-img" src="${images[0] || 'assets/placeholder.png'}" alt="${data.name}">
                        </div>
                        <div class="product-thumbnails">${thumbnails}</div>
                        <div class="product-detail-title">${data.name}</div>
                        <div class="product-detail-price">₹${data.price}</div>
                        <div class="product-detail-desc">${formattedDescription}</div> 
                        <div class="product-detail-actions">
                            <button id="add-to-cart-btn" class="add-to-cart-btn" onclick="addToCart()">Add to Cart</button>
                            <button id="buy-now-btn" class="buy-now-btn" onclick="buyNow()">Buy Now</button>
                        </div>
                    </div>
                `;
            }).catch((error) => {
                console.error("Error loading product:", error);
                document.getElementById('product-detail').innerHTML = "<h1>Error loading product!</h1>";
            });
        }
        
        // --- Your other functions (addToCart, buyNow, etc.) go here ---
        function addToCart() { /* ... */ }
        function buyNow() { /* ... */ }
        function setMainImage(url) { /* ... */ }

    </script>
</body>
</html>
